spring.application.name=project
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# Oracle DB 연결 설정
spring.datasource.url=jdbc:oracle:thin:@127.0.0.1:1521/xe  # Oracle DB URL
spring.datasource.username=webuser
spring.datasource.password=123456
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# MyBatis 설정
mybatis.mapper-locations=classpath:/mapper/*.xml  # Mapper XML 파일 경로
mybatis.type-aliases-package=com.kh.homePageProject.model  # 모델 클래스 패키지