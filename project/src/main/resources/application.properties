spring.application.name=project
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# Oracle DB 연결 설정
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1  # Oracle DB URL
spring.datasource.username=webuser
spring.datasource.password=123456
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# MyBatis 설정
mybatis.mapper-locations=classpath:/mappers/*.xml  # Mapper XML 파일 경로
mybatis.type-aliases-package=com.example.domain  # 도메인 클래스 패키지